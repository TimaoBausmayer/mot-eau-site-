<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>Mon Coach Maison</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Mise en page : une colonne type appli, navigation en bas ; vert profond + orange énergie pour les records */
:root{
  --bg:#f1f4f0; --surface:#ffffff; --surface2:#e7eee8; --ink:#14201b; --muted:#5b6b62; --line:#d6ded7;
  --accent:#0e7c6b; --accent-ink:#ffffff; --accent-soft:#d3ebe5; --warm:#d9501f; --warm-soft:#fadfd3;
  --good:#23824f; --warn:#a97400; --bad:#bb3a2b; --fig:#14201b; --figfar:#8b9b92; --shirt:#0e7c6b; --short:#2a3b52;
  --f-display:'Barlow Condensed','Arial Narrow',Impact,sans-serif; --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1411; --surface:#16211c; --surface2:#1e2c25; --ink:#e8f1ec; --muted:#96a99f; --line:#2b3b34;
  --accent:#3ccfb2; --accent-ink:#06251f; --accent-soft:#143b33; --warm:#ff8355; --warm-soft:#3a2219;
  --good:#5fd08c; --warn:#e8b13a; --bad:#ff7a6b; --fig:#e8f1ec; --figfar:#5f7369; --shirt:#3ccfb2; --short:#6f86a6; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0d1411; --surface:#16211c; --surface2:#1e2c25; --ink:#e8f1ec; --muted:#96a99f; --line:#2b3b34;
  --accent:#3ccfb2; --accent-ink:#06251f; --accent-soft:#143b33; --warm:#ff8355; --warm-soft:#3a2219;
  --good:#5fd08c; --warn:#e8b13a; --bad:#ff7a6b; --fig:#e8f1ec; --figfar:#5f7369; --shirt:#3ccfb2; --short:#6f86a6; color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 96px;}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.04em;margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:34px} h2{font-size:21px} h3{font-size:16px;color:var(--muted)}
p{margin:0} .muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.num{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.soft{background:var(--accent-soft);border-color:transparent}
.card.warm{background:var(--warm-soft);border-color:transparent}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sb{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat .num{font-size:32px;line-height:1}
.stat .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.delta{font-size:13px;font-weight:700}.delta.up{color:var(--warm)}.delta.down{color:var(--good)}

button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px 18px;font-weight:700;min-height:46px}
.btn.big{font-family:var(--f-display);font-size:22px;letter-spacing:.05em;text-transform:uppercase;min-height:56px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.warm{background:var(--warm);color:#fff}
.btn.sm{padding:8px 12px;min-height:36px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,.day:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--surface2);border:1.5px solid transparent;border-radius:999px;padding:8px 14px;font-weight:500;min-height:38px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
input[type=range]{padding:0;min-height:30px;accent-color:var(--accent)}
input[type=checkbox]{width:20px;min-height:20px;accent-color:var(--accent)}
.stepper{display:grid;grid-template-columns:44px 1fr 44px;gap:6px}
.stepper button{background:var(--surface2);border:0;border-radius:10px;font-size:22px;font-weight:700}
.stepper input{text-align:center;font-family:var(--f-display);font-size:26px;font-weight:700}

/* navigation */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;width:100%;max-width:560px}
.tab{background:none;border:0;border-radius:10px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);min-height:48px}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent);font-weight:700;background:var(--accent-soft)}

/* semaine */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{background:var(--surface2);border:2px solid transparent;border-radius:12px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:68px}
.day .dn{font-size:11px;color:var(--muted);text-transform:uppercase}
.day .dd{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1}
.day .ds{font-size:10px;line-height:1.1;color:var(--muted);text-align:center}
.day.done{background:var(--accent);color:var(--accent-ink)} .day.done .dn,.day.done .ds{color:inherit}
.day.rest{background:transparent;border:1.5px dashed var(--line)}
.day.today{border-color:var(--warm)}

/* graphiques */
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font:11px var(--f-body);font-variant-numeric:tabular-nums}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{stroke:var(--accent);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;animation:draw 1.1s ease backwards}
.chart .ln.warm{stroke:var(--warm)}
.chart .area{fill:var(--accent);opacity:.12}
.chart .dot{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .dot.last{fill:var(--accent)}
.chart .dot.pr{fill:var(--warm);stroke:var(--warm)}
.chart .dot.minor{fill:var(--muted);stroke:none;opacity:.5}
.chart .tgt{stroke:var(--warm);stroke-width:1.5;stroke-dasharray:5 4}
.chart .bar{fill:var(--accent-soft);transform-origin:bottom;animation:grow .7s ease backwards}
.chart .bar.cur{fill:var(--accent)}
.chart text.val{fill:var(--ink);font-weight:700}
.chart text.tl{fill:var(--warm)}
/* niveaux, planning */
.gz{display:flex;flex-direction:column;gap:6px}
.gauge{position:relative;padding-bottom:18px}
.seg{display:flex;gap:3px;height:12px}.seg i{flex:1;border-radius:6px}
.seg .g0{background:color-mix(in srgb,var(--warm) 75%,var(--surface))}.seg .g1{background:color-mix(in srgb,var(--warm) 30%,var(--surface))}
.seg .g2{background:color-mix(in srgb,var(--accent) 35%,var(--surface))}.seg .g3{background:color-mix(in srgb,var(--accent) 70%,var(--surface))}.seg .g4{background:var(--accent)}
.mk{position:absolute;top:-4px;width:6px;height:20px;border-radius:3px;background:var(--ink);border:2px solid var(--surface);transform:translateX(-50%);animation:mk 1.1s .15s cubic-bezier(.2,.8,.2,1) backwards}
.tk{position:absolute;top:18px;font-size:10px;color:var(--muted);transform:translateX(-50%);font-variant-numeric:tabular-nums}
.badge.lv0{background:var(--warm-soft);color:var(--warm)}.badge.lv1,.badge.lv2,.badge.lv3,.badge.lv4{background:var(--accent-soft);color:var(--accent)}
@keyframes mk{from{left:0}}
.ring .fg.sc{animation:ringin 1.2s cubic-bezier(.2,.8,.2,1) backwards;transition:none}
@keyframes ringin{from{stroke-dashoffset:276.46}}
button.card{font:inherit;color:inherit;width:100%}
.arow{display:grid;grid-template-columns:40px 1fr 110px;gap:8px;align-items:center}
.plist{display:flex;flex-direction:column;gap:8px}.prow{display:grid;grid-template-columns:40px 1fr;gap:8px;align-items:start}
@keyframes draw{from{stroke-dashoffset:1;stroke-dasharray:1}to{stroke-dashoffset:0;stroke-dasharray:1}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat div{aspect-ratio:1;border-radius:8px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.heat .h1{background:var(--accent-soft);color:var(--ink)}.heat .h2{background:color-mix(in srgb,var(--accent) 55%,var(--surface));color:var(--accent-ink)}.heat .h3{background:var(--accent);color:var(--accent-ink);font-weight:700}
.heat .hr{background:transparent;border:1.5px dashed var(--line)}.heat .ht{outline:2px solid var(--warm)}.heat .hx{opacity:.35}
.heat .hd{font-size:11px;text-transform:uppercase;background:none;aspect-ratio:auto;color:var(--muted)}

/* bonhomme */
svg.fig{width:100%;height:auto;display:block;overflow:visible}
.fig line,.fig circle{stroke:var(--fig);stroke-linecap:round;fill:none}
.fig .s-torso{stroke:var(--shirt);stroke-width:11}.fig .s-th{stroke-width:8}.fig .s-short{stroke:var(--short);stroke-width:9.5}.fig .s-sh{stroke-width:6.5}.fig .s-ft{stroke-width:5.5}
.fig .s-ua{stroke-width:6.5}.fig .s-fa{stroke-width:5.2}.fig .s-neck{stroke-width:4}
.fig .f-head{fill:var(--fig);stroke:none}.fig .f-eye{fill:var(--bg);stroke:none}
.fig .f-far line{stroke:var(--figfar)}.fig .f-far .s-th,.fig .f-far .s-sh,.fig .f-far .s-ft{stroke:color-mix(in srgb,var(--short) 55%,var(--bg))}
.fig .ghost line{stroke:var(--accent);opacity:.17}.fig .ghost .s-torso{stroke-width:11}.fig .ghost .gh-head{fill:var(--accent);stroke:none;opacity:.17}
.fig .f-floor{stroke:var(--line);stroke-width:2}.fig .f-mat{fill:var(--accent);stroke:none;opacity:.8}
.fig .f-shadow{fill:var(--ink);opacity:1;fill-opacity:.12;stroke:none}
.fig .f-chair rect{fill:var(--warm);stroke:none}.fig .f-chair line{stroke:var(--warm);stroke-width:3.5}
.fig .f-bottle{stroke:var(--warm);stroke-width:7}
.fig.tg-abdos .s-torso,.fig.tg-cardio .s-torso{stroke:var(--warm);animation:tgp 1.1s ease-in-out infinite}
.fig.tg-bras .live .s-ua,.fig.tg-bras .live .s-fa,.fig.tg-cardio .near .s-ua,.fig.tg-cardio .near .s-fa{stroke:var(--warm);animation:tgp 1.1s ease-in-out infinite}
.fig.tg-jambes .live .s-th,.fig.tg-jambes .live .s-sh{stroke:var(--warm);animation:tgp 1.1s ease-in-out infinite}.fig.tg-jambes .live .s-short{stroke:var(--warm)}
.fig.tg-cardio .near .s-th,.fig.tg-cardio .near .s-sh{stroke:var(--warm);animation:tgp 1.1s ease-in-out infinite}
@keyframes tgp{50%{stroke-opacity:.62}}
.figbox{background:var(--surface2);border-radius:12px;padding:4px 8px}
.item{display:grid;grid-template-columns:96px 1fr auto;gap:12px;align-items:center;background:var(--surface2);border-radius:12px;padding:6px 12px 6px 6px}
.item .figbox{padding:0;background:var(--surface)}
.badge{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--surface2);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.badge.z-abdos{background:var(--warm-soft);color:var(--warm)} .badge.z-bras,.badge.z-jambes,.badge.z-cardio{background:var(--accent-soft);color:var(--accent)}

/* repas */
.meal{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.bar{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .8s ease}
.bar>i.over{background:var(--warm)}
.tag{display:inline-flex;gap:6px;align-items:center;background:var(--surface2);border-radius:8px;padding:3px 8px;font-size:13px}
.tag input{width:64px;min-height:28px;padding:2px 6px;font-size:13px}
.advice{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.advice li{padding-left:16px;position:relative}.advice li::before{content:"";position:absolute;left:0;top:.6em;width:7px;height:7px;border-radius:50%;background:var(--accent)}

/* lecteur de séance */
#player{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
#player .in{width:100%;max-width:520px;display:flex;flex-direction:column;gap:12px;flex:1}
#player .ph{display:flex;flex-direction:column;gap:2px}
#pfig{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px}
.ring{position:relative;width:150px;height:150px;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .bg{stroke:var(--surface2)}.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .12s linear}
.ring.rest .fg{stroke:var(--warm)}
.ring .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:56px}
.ctrl{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px}
.progress{display:flex;gap:3px}.progress i{flex:1;height:5px;border-radius:3px;background:var(--surface2)}.progress i.on{background:var(--accent)}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:90;width:100%;height:100%}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:80;font-weight:500;max-width:90%;text-align:center;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.sync{font-size:11px;color:var(--muted)}
.exdemo{background:var(--warm-soft);color:var(--ink);border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
details summary{cursor:pointer;font-weight:700}

/* mouvement et finitions */
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
#main>*{animation:rise .38s ease backwards}
#main>*:nth-child(2){animation-delay:.04s}#main>*:nth-child(3){animation-delay:.08s}#main>*:nth-child(4){animation-delay:.12s}#main>*:nth-child(5){animation-delay:.16s}#main>*:nth-child(n+6){animation-delay:.2s}
.btn:active,.chip:active,.day:active,.tab:active,button.card:active{transform:scale(.97)}
.btn,.chip,.day,.tab{transition:transform .12s ease,background-color .2s ease}
.item[role=button]{cursor:pointer;text-align:left;transition:transform .12s ease,box-shadow .2s}.item[role=button]:active{transform:scale(.985)}
.item[role=button]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.item .mu{font-size:12px;color:var(--muted)}
.phase{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.06em;font-size:14px;color:var(--muted);margin-top:6px}
.cuebar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px}
.cue{font-family:var(--f-display);font-size:26px;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);animation:cuein .3s ease backwards}
@keyframes cuein{from{opacity:0;transform:translateY(6px)}}
.tempo{display:flex;flex-direction:column;align-items:center;line-height:1;background:var(--surface2);border-radius:12px;padding:6px 12px;min-width:68px}
.tempo b{font-family:var(--f-display);font-size:30px;font-variant-numeric:tabular-nums;animation:bump .25s ease}
.tempo span{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
@keyframes bump{from{transform:scale(1.35);color:var(--warm)}}
.chip.mini{min-height:30px;padding:4px 10px;font-size:13px}
#modal{position:fixed;inset:0;z-index:70;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;overflow:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#modal .in{width:100%;max-width:520px;display:flex;flex-direction:column;gap:12px;animation:rise .3s ease backwards}
.glasses{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.gl{aspect-ratio:3/4;border:2px solid var(--line);border-radius:4px 4px 10px 10px;position:relative;overflow:hidden;background:var(--bg)}
.gl i{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--accent);transition:height .6s cubic-bezier(.2,.8,.2,1)}
.gl.on i{height:100%}.gl.half i{height:50%}
.gl.pop{animation:bump .4s ease}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bd{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12px;line-height:1.2;color:var(--muted)}
.bd .m{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:22px;border:2px dashed var(--line);color:var(--muted)}
.bd.on{color:var(--ink)}.bd.on .m{border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 4px var(--accent-soft);animation:bump .5s ease}

/* objectifs, apprentissage, série, alertes */
.subnav{background:var(--surface2);border-radius:999px;padding:4px;gap:4px;flex-wrap:nowrap}
.subnav .chip{flex:1;text-align:center;padding:8px 6px;min-height:36px;background:transparent}
.subnav .chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.badge.sk-ok{background:var(--accent-soft);color:var(--accent)}.badge.sk-no{background:var(--warm-soft);color:var(--warm)}.badge.sk-learn{background:color-mix(in srgb,var(--warn) 25%,var(--surface));color:var(--ink)}
ol.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.advice.bad li::before{background:var(--warm)}
.grow{display:grid;grid-template-columns:92px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--surface2)}
.grow.today{outline:2px solid var(--warm)}
.badge.gs-done,.badge.gs-ahead{background:var(--accent-soft);color:var(--accent)}.badge.gs-ok{background:var(--surface2);color:var(--ink)}.badge.gs-late{background:var(--warm-soft);color:var(--warm)}
.gs-t-late{color:var(--warm);font-weight:700}.gs-t-ahead,.gs-t-done{color:var(--accent);font-weight:700}
.flame{width:64px;height:76px;flex:none}.flame path{fill:var(--line)}
.flame.lit .f1{fill:var(--warm)}.flame.lit .f2{fill:var(--warn)}
.flame.lit{transform-origin:50% 90%;animation:flick 1.4s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.05,.97) rotate(-2deg)}60%{transform:scale(.97,1.05) rotate(2deg)}}

/* Bandeau d'erreur : si quelque chose casse, la cause s'affiche à l'écran */
(function () {
  function show(msg) {
    try {
      var b = document.getElementById('errbar');
      if (!b) { b = document.createElement('div'); b.id = 'errbar'; b.setAttribute('role', 'alert'); b.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:999;background:#bb3a2b;color:#fff;padding:10px 16px;font:13px/1.35 system-ui,sans-serif;word-break:break-word'; document.body.appendChild(b); }
      b.textContent = 'Erreur dans l’appli : ' + msg + '  (envoie-moi ce texte)';
    } catch (e) { }
  }
  window.addEventListener('error', function (e) { show((e.message || 'inconnue') + (e.lineno ? ' [ligne ' + e.lineno + ']' : '')); });
  window.addEventListener('unhandledrejection', function (e) { show(String((e.reason && e.reason.message) || e.reason || 'promesse rejetée')); });
})();

<script>
/* ===== Bonhomme animé : cinématique par angles (0° = droite, 90° = bas, -90° = haut) ===== */
const L = { torso: 34, ua: 16, fa: 15, th: 24, sh: 23, head: 7.5, toe: 6 };
const FLOOR = 118;
const rad = a => a * Math.PI / 180;
const dir = a => [Math.cos(rad(a)), Math.sin(rad(a))];
const add = (p, d, len) => [p[0] + d[0] * len, p[1] + d[1] * len];

/* pose : t torse, hd tête, a=[bras proche], b=[bras loin], l=[cuisse,tibia,pied] proche, m=[...] loin, lift */
function solvePose(p) {
  const hip = [0, 0];
  const sh = add(hip, dir(p.t), L.torso);
  const head = add(sh, dir(p.t + (p.hd || 0)), L.head + 2);
  const a = p.a, b = p.b || p.a;
  const el = add(sh, dir(a[0]), L.ua), ha = add(el, dir(a[1]), L.fa);
  const el2 = add(sh, dir(b[0]), L.ua), ha2 = add(el2, dir(b[1]), L.fa);
  const l = p.l, m = p.m || p.l;
  const kn = add(hip, dir(l[0]), L.th), ft = add(kn, dir(l[1]), L.sh), to = add(ft, dir(l[2] || 0), L.toe);
  const kn2 = add(hip, dir(m[0]), L.th), ft2 = add(kn2, dir(m[1]), L.sh), to2 = add(ft2, dir(m[2] || 0), L.toe);
  return { hip, sh, head, el, ha, el2, ha2, kn, ft, to, kn2, ft2, to2 };
}
const JOINT = { foot: 'ft', foot2: 'ft2', hand: 'ha', hip: 'hip', knee: 'kn' };

function lerpPose(A, B, k) {
  const n = (x, y) => x + (y - x) * k;
  const arr = (x, y, d) => { x = x || d; y = y || d; return x.map((v, i) => n(v, y[i] === undefined ? v : y[i])); };
  return {
    t: n(A.t, B.t), hd: n(A.hd || 0, B.hd || 0), lift: n(A.lift || 0, B.lift || 0),
    a: arr(A.a, B.a), b: arr(A.b || A.a, B.b || B.a), l: arr(A.l, B.l), m: arr(A.m || A.l, B.m || B.l)
  };
}
const ease = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;

function placed(pose, ex) {
  const s = solvePose(pose);
  let maxY = -1e9;
  ['sh', 'el', 'ha', 'el2', 'ha2', 'kn', 'ft', 'to', 'kn2', 'ft2', 'to2', 'hip'].forEach(k => { maxY = Math.max(maxY, s[k][1]); });
  maxY = Math.max(maxY, s.head[1] + L.head - 1.5);
  const pin = ex.pin || { j: 'hip', x: 120 };
  const dx = pin.x - s[JOINT[pin.j]][0], dy = FLOOR - maxY - (pose.lift || 0);
  const out = {};
  for (const k in s) out[k] = [s[k][0] + dx, s[k][1] + dy];
  return out;
}

function figSVG(ex) {
  const id = 'f' + Math.random().toString(36).slice(2, 8);
  let props = '';
  if (ex.mat) props += '<rect class="f-mat" x="14" y="' + FLOOR + '" width="212" height="5" rx="2.5"/>';
  else props += '<line class="f-floor" x1="14" y1="' + (FLOOR + 1) + '" x2="226" y2="' + (FLOOR + 1) + '"/>';
  props += '<ellipse class="f-shadow" cx="120" cy="' + (FLOOR + (ex.mat ? 1 : 0)) + '" rx="30" ry="3.2"/>';
  if (ex.chair) {
    const c = ex.chair, top = FLOOR - c.h;
    props += '<g class="f-chair"><rect x="' + c.x + '" y="' + top + '" width="' + c.w + '" height="4" rx="1.5"/>' +
      '<line x1="' + (c.x + 3) + '" y1="' + top + '" x2="' + (c.x + 3) + '" y2="' + FLOOR + '"/>' +
      '<line x1="' + (c.x + c.w - 3) + '" y1="' + top + '" x2="' + (c.x + c.w - 3) + '" y2="' + FLOOR + '"/>' +
      (c.back ? '<line x1="' + (c.x + (c.back > 0 ? c.w - 3 : 3)) + '" y1="' + top + '" x2="' + (c.x + (c.back > 0 ? c.w - 3 : 3)) + '" y2="' + (top - 26) + '"/>' : '') + '</g>';
  }
  const L2 = (s, c, f) => '<line data-s="' + s + '" class="' + c + '"' + (f ? ' data-f="' + f + '"' : '') + '/>';
  const bottle = ex.bottle ? '<line class="f-bottle" data-b="1"/><line class="f-bottle" data-b="2"/>' : '';
  const ghost = ex.loop ? '' : '<g class="ghost"><line data-s="sh-hip" class="s-torso"/><line data-s="kn-hip" class="s-th"/><line data-s="ft-kn" class="s-sh"/><line data-s="to-ft" class="s-ft"/><line data-s="el-sh" class="s-ua"/><line data-s="ha-el" class="s-fa"/><circle class="gh-head" r="' + L.head + '" data-s="head"/></g>';
  return '<svg class="fig tg-' + ex.z + '" viewBox="0 -6 240 146" role="img" aria-label="' + esc(ex.n) + '" data-fig="' + id + '">' + props + ghost +
    '<g class="live"><g class="f-far">' + L2('el2-sh', 's-ua') + L2('ha2-el2', 's-fa') + L2('kn2-hip', 's-th') + L2('ft2-kn2', 's-sh') + L2('to2-ft2', 's-ft') + '</g>' +
    '<g class="f-near">' + L2('sh-hip', 's-torso') + L2('kn-hip', 's-th') + L2('kn-hip', 's-short', '.5') + L2('ft-kn', 's-sh') + L2('to-ft', 's-ft') + L2('el-sh', 's-ua') + L2('ha-el', 's-fa') + '</g>' +
    '<line data-s="sh-head" class="s-neck"/><circle class="f-head" r="' + L.head + '" data-s="head"/><circle class="f-eye" r="1.3" data-s="eye"/>' + bottle + '</g></svg>';
}

function drawPose(svg, ex, pose, scope) {
  if (svg.tagName === 'CANVAS') { if (svg.__fig) draw3D(svg.__fig, pose); return; }
  const j = placed(pose, ex), root = scope || svg.querySelector('g.live');
  const ep = (k) => k === 'eye' ? [j.head[0] + 3.7 * Math.cos(rad(pose.t + (pose.hd || 0) + 60)), j.head[1] + 3.7 * Math.sin(rad(pose.t + (pose.hd || 0) + 60))] : j[k];
  root.querySelectorAll('line[data-s]').forEach(ln => {
    const [a, b] = ln.dataset.s.split('-'), A = j[a], B = j[b], f = +ln.dataset.f || 1;
    ln.setAttribute('x1', A[0].toFixed(1)); ln.setAttribute('y1', A[1].toFixed(1));
    ln.setAttribute('x2', (A[0] + (B[0] - A[0]) * f).toFixed(1)); ln.setAttribute('y2', (A[1] + (B[1] - A[1]) * f).toFixed(1));
  });
  root.querySelectorAll('circle[data-s]').forEach(c => { const p = ep(c.dataset.s); c.setAttribute('cx', p[0].toFixed(1)); c.setAttribute('cy', p[1].toFixed(1)); });
  if (scope) return;
  /* ombre au sol : suit les points d'appui, se réduit quand on saute */
  const pts = ['ft', 'ft2', 'to', 'to2', 'ha', 'ha2', 'kn', 'hip', 'sh'].map(k => j[k]).filter(p => p[1] >= FLOOR - 4);
  const sh = svg.querySelector('.f-shadow');
  if (sh) {
    if (pts.length) { const xs = pts.map(p => p[0]), mn = Math.min(...xs), mx = Math.max(...xs); sh.setAttribute('cx', ((mn + mx) / 2).toFixed(1)); sh.setAttribute('rx', Math.max(14, (mx - mn) / 2 + 12).toFixed(1)); sh.style.opacity = 1; }
    else { sh.setAttribute('cx', j.hip[0].toFixed(1)); sh.setAttribute('rx', 16); sh.style.opacity = .45; }
  }
  svg.querySelectorAll('line[data-b]').forEach(bt => {
    const far = bt.dataset.b === '2';
    const ha = far ? j.ha2 : j.ha, el = far ? j.el2 : j.el;
    const dx = ha[0] - el[0], dy = ha[1] - el[1], d = Math.hypot(dx, dy) || 1;
    const ux = dx / d, uy = dy / d;
    bt.setAttribute('x1', (ha[0] - ux * 4).toFixed(1)); bt.setAttribute('y1', (ha[1] - uy * 4).toFixed(1));
    bt.setAttribute('x2', (ha[0] + ux * 8).toFixed(1)); bt.setAttribute('y2', (ha[1] + uy * 8).toFixed(1));
    if (far && !(ex.fr[0].b)) bt.style.display = 'none';
  });
}

/* Animation : image à image, avec une courte pause aux extrémités */
const FIGS = [];
function mountFig(host, ex, o = {}) {
  const is3 = init3D();
  host.innerHTML = is3 ? '<canvas class="fig fig3d" role="img" aria-label="' + esc(ex.n) + '"></canvas>' : figSVG(ex);
  const svg = host.firstElementChild;
  const f = { svg, ex, t0: performance.now() + (o.delay || 0), speed: o.speed || 1, still: !!o.still, paused: 0, mini: !!o.mini, is3 };
  if (is3) { f.ctx = svg.getContext('2d'); if (!o.mini) bindOrbit(svg, f); }
  FIGS.push(f); svg.__fig = f;
  drawPose(svg, ex, ex.fr[0]);
  if (!is3) { const gh = svg.querySelector('g.ghost'); if (gh) drawPose(svg, ex, ex.fr[ex.fr.length - 1], gh); }
  return svg;
}
function segInfo(ex, t, speed) {
  const n = ex.fr.length, ms = (ex.ms || 800) / speed, seq = ex.loop ? n : (n - 1) * 2, pos = ((t / ms) % seq + seq) % seq;
  return { i: Math.floor(pos), k: pos - Math.floor(pos), n, seq, ms, cycles: Math.floor(t / ms / seq), segs: Math.floor(t / ms) };
}
function poseAt(ex, t, speed) {
  const fr = ex.fr, n = fr.length; if (n === 1) return fr[0];
  const { i, k } = segInfo(ex, t, speed), h = ex.hold !== undefined ? ex.hold : (ex.ms >= 700 ? .14 : 0);
  const kk = ease(h ? Math.min(1, Math.max(0, (k - h) / (1 - 2 * h))) : k);
  let ia, ib;
  if (ex.loop) { ia = i % n; ib = (i + 1) % n; return lerpPose(fr[ia], fr[ib], h ? kk : k); }
  const seq = (n - 1) * 2;
  if (i < n - 1) { ia = i; ib = i + 1; } else { ia = seq - i; ib = seq - i - 1; }
  return lerpPose(fr[ia], fr[ib], kk);
}
/* consigne et répétition en cours, d'après l'horloge de l'animation */
function figPhase(f, now) {
  const t = Math.max(0, (f.paused ? f.paused : now) - f.t0), ex = f.ex, s = segInfo(ex, t, f.speed), c = ex.cues || ['', ''];
  const cue = ex.loop ? c[(s.i + 1) % c.length] : (s.i < s.n - 1 ? c[0] : c[1] || c[0]);
  const rep = ex.loop ? s.cycles : ex.alt ? s.segs : s.cycles;
  return { cue, rep, moving: !(ex.fr.length === 1) };
}
let figRAF = 0;
function figTick(now) {
  R3.now = now; R3.frame++;
  const minis = [];
  for (let i = FIGS.length - 1; i >= 0; i--) {
    const f = FIGS[i];
    if (!f.svg.isConnected) { FIGS.splice(i, 1); continue; }
    if (f.still || f.paused) continue;
    const t = now - f.t0; if (t < 0) continue;
    if (f.is3 && f.mini) { minis.push(f); continue; }
    if (f.is3 && !figVisible(f.svg)) continue;
    drawPose(f.svg, f.ex, poseAt(f.ex, t, f.speed));
  }
  /* vignettes 3D : au plus trois par image, à tour de rôle, et seulement celles qui sont à l'écran */
  if (minis.length) {
    const vis = minis.filter(f => figVisible(f.svg)), n = vis.length;
    for (let k = 0; k < Math.min(3, n); k++) { const f = vis[(R3.cur + k) % n]; drawPose(f.svg, f.ex, poseAt(f.ex, now - f.t0, f.speed)); }
    R3.cur = n ? (R3.cur + 3) % n : 0;
  }
  figRAF = requestAnimationFrame(figTick);
}
function startFigs() { if (!figRAF) figRAF = requestAnimationFrame(figTick); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

/* ===== Claude : analyse de la journée ===== */
function daySummary(d) {
  const b = body(), t = dayTot(d), p = P();
  let s = 'Journée du ' + fmtLong(d) + '\n';
  if (b) s += 'Profil : ' + b.a + ' ans, ' + nf(b.h, 0) + ' cm, ' + nf(b.w) + ' kg, objectif « ' + ({ lose: 'perdre du poids', keep: 'rester stable et se muscler', gain: 'prendre du muscle' })[p.goal] + ' ». Cible : ' + b.kcal + ' kcal, ' + b.prot + ' g de protéines.\n';
  mealsOf(d).forEach(m => { s += '- ' + m.type + ' : ' + m.text + ' (≈ ' + mealTot(m).kcal + ' kcal)\n'; });
  s += 'Total estimé : ' + t.kcal + ' kcal, ' + t.p + ' g de protéines.\n';
  const ses = S.sessions.filter(x => x.d === d); s += ses.length ? 'Sport : ' + ses.map(x => x.min + ' min').join(', ') + '.\n' : 'Sport : aucune séance notée.\n';
  return s;
}

/* ---------- Course à pied : de la marche à la course continue ---------- */
function runStages(T) {
  const base = [[1, 2, 8], [1.5, 2, 7], [2, 2, 6], [3, 2, 5], [4, 2, 4], [5, 2, 3], [6, 1.5, 3], [8, 2, 2], [10, 2, 2], [12, 2, 2], [15, 2, 1, 10]];
  const st = base.filter(b => b[0] * (b[2] || 1) <= T).map(([r, w, n, x]) => ({ r, w, n, x: x || 0 }));
  for (let m = 20; m < T; m += 5) st.push({ r: m, w: 0, n: 1, x: 0 });
  st.push({ r: T, w: 0, n: 1, x: 0 });
  return st.filter((s, i) => i === 0 || s.r !== st[i - 1].r || s.n !== st[i - 1].n);
}
const runTotal = s => s.r * s.n + s.w * (s.n - 1) + (s.x ? s.w + s.x : 0);
const stageLabel = s => s.n > 1 ? s.n + ' × (' + nf(s.r, s.r % 1 ? 1 : 0) + ' min de course, ' + nf(s.w, s.w % 1 ? 1 : 0) + ' min de marche)' : s.x ? s.r + ' min de course, 2 min de marche, ' + s.x + ' min de course' : s.r + ' min de course continue';
const runT = () => S.goal && S.goal.type === 'run' ? S.goal.T : 30;
function buildRunPlan() {
  const T = runT(), st = runStages(T), idx = Math.min(S.run.stage, st.length - 1), s = st[idx], items = [];
  const mk = (ex, dur, ph, hint) => items.push({ ex, dur, rest: 0, phase: ph, hint });
  mk(EXBY.marche, 300, 'warm', 'Marche d’un bon pas pour te chauffer');
  for (let i = 0; i < s.n; i++) { mk(EXBY.course, Math.round(s.r * 60), 'main', 'Cours doucement, tu dois pouvoir parler'); if (i < s.n - 1) mk(EXBY.marche, Math.round(s.w * 60), 'main', 'Marche pour récupérer'); }
  if (s.x) { mk(EXBY.marche, Math.round(s.w * 60), 'main', 'Marche pour récupérer'); mk(EXBY.course, Math.round(s.x * 60), 'main', 'Cours doucement'); }
  mk(EXBY.marche, 300, 'cool', 'Marche tranquille pour redescendre');
  return { min: Math.round(items.reduce((a, i) => a + i.dur, 0) / 60), focus: 'run', lvl: 1, items, kcal: planKcal(items), secs: items.reduce((a, i) => a + i.dur, 0), work: 0, rest: 0, run: true, stage: idx, nStages: st.length, label: stageLabel(s) };
}
function startRun() { const p = buildRunPlan(); U.T.plan = p; U.T.focus = 'run'; startPlayer(p); }

/* ---------- Objectifs en nombre de jours ---------- */
const GT = { reps: 'Plus de répétitions', weight: 'Mon poids', run: 'Courir' };
const gname = g => g.type === 'reps' ? (TRACK.find(x => x.k === g.ex) || {}).n : g.type === 'weight' ? 'Poids' : 'Course';
const gspan = g => ({ left: Math.max(0, diffDays(g.end, today())), el: clamp(diffDays(today(), g.start), 0, g.days) });
function gcur(g) { return g.type === 'reps' ? bestOf(g.ex) : g.type === 'weight' ? (latestW() || { kg: g.from }).kg : S.run.stage; }
function gfrac(g) {
  if (g.type === 'run') return clamp(Math.max(S.run.stage / runStages(g.T).length, runBests(runsOf().filter(s => s.d >= g.start)).dist / g.target), 0, 1);
  const den = g.target - g.from; return den ? clamp((gcur(g) - g.from) / den, 0, 1) : 1;
}
function gstatus(g) {

      S.weights = S.weights.filter(x => x.d !== today()); S.weights.push({ d: today(), kg: +w.toFixed(2) }); save(); keep(); render(); toast('Poids noté : ' + nf(w) + ' kg'); break;
    }
    case 'mre': { const tx = (U.recent || [])[+v]; if (tx) { const m = addMeal(tx, autoType(), U.mealDate); keep(); render(); toast('≈ ' + mealTot(m).kcal + ' kcal ajoutées'); } break; }
    case 'openweek': U.weekMon = mondayOf(today()); if (isoDow(today()) === 1 && !weekStats(U.weekMon).any) U.weekMon = addDays(U.weekMon, -7); U.tab = 'week'; render(); break;
    case 'wkshift': { const m = addDays(U.weekMon, 7 * +v); if (m <= mondayOf(today())) { U.weekMon = m; U.copy = ''; render(); } break; }
    case 'askweek': askWeek(); break;
    case 'copyweek': {
      U.copy = weekSummary(weekStats(U.weekMon)) + '\nPeux-tu me faire le bilan de ma semaine (points forts, à améliorer) et me dire quoi faire la semaine prochaine ?';
      try { navigator.clipboard.writeText(U.copy).then(() => toast('Résumé copié'), () => toast('Sélectionne le texte pour le copier')); } catch (x) { toast('Sélectionne le texte pour le copier'); }
      keep(); render(); break;
    }
    case 'gosched': U.tab = 'profile'; render(); break;
    case 'autodays': P().trainDays = autoDays(); P().availSet = true; save(); keep(); render(); toast('Jours proposés : ' + P().trainDays.map(d => DOW[d]).join(', ')); break;
    case 'firstrec': {
      const dd = val('fr-date') || today(); let n = 0;
      TRACK.forEach(tr => { const v = Math.round(num(val('fr-' + tr.k))); if (v > 0) { S.records.push({ id: uid(), d: dd > today() ? today() : dd, ex: tr.k, val: v, test: true }); n++; } });
      if (!n) { toast('Entre au moins un résultat'); break; } save(); render(); toast(n + ' record' + (n > 1 ? 's notés' : ' noté')); break;
    }
    case 'recdel': S.records = S.records.filter(r => r.id !== b.dataset.id); save(); keep(); render(); break;
    case 'daytoggle': { const d = b.dataset.d; S.plan[d] = effPlan(d) === 'rest' ? 'train' : 'rest'; save(); keep(); render(); break; }
    case 'onboard': {
      const w = num(val('ob-w')), h = num(val('ob-h')), ag = num(val('ob-a')), err = $('#ob-err');
      U.wkg = val('ob-w');
      if (!(w >= 25 && w <= 300)) { err.textContent = 'Entre un poids entre 25 et 300 kg (ex. 74,6).'; break; }
      if (!(h >= 100 && h <= 250)) { err.textContent = 'Entre ta taille en centimètres (ex. 178).'; break; }
      if (!(ag >= 10 && ag <= 100)) { err.textContent = 'Entre ton âge (ex. 24).'; break; }
      Object.assign(P(), { height: String(h), age: String(Math.round(ag)), sex: val('ob-s'), goal: val('ob-g') });
      S.weights.push({ d: today(), kg: +w.toFixed(2) }); U.wkg = ''; save(); render(); toast('C’est parti !'); break;
    }
    case 'demo': U.quiet = true; S = demoData(); save(); U.quiet = false; checkBadges(true); U.boot = true; checkStreak(); U.boot = false; U.tab = 'today'; render(); break;
    case 'wipe': {
      if (S.demo || Date.now() - wipeArm < 4000) { S = defaults(); save(); U.T.plan = null; U.exportTxt = ''; U.tab = 'today'; render(); }
      else { wipeArm = Date.now(); toast('Touche encore une fois pour tout effacer'); }
      break;
    }
    case 'rdsave': {
      const k = b.dataset.k, n = Math.round(num(val('rd-' + k))); if (!(n > 0)) { toast('Entre ton résultat'); break; }
      const pr = prOf(k); S.records.push({ id: uid(), d: today(), ex: k, val: n, test: true }); save(); keep(); render();
      if (n > pr && pr > 0) { confetti(); toast('Nouveau record : ' + n + ' !'); } else toast(pr ? 'Noté. Record à battre : ' + pr : 'Premier record noté : ' + n);
      break;
    }
    /* séance */
    case 'tmin': U.T.min = +v; keep(); render(); break;
    case 'tfocus': U.T.focus = v; keep(); render(); break;
    case 'tlevel': U.T.level = +v; keep(); render(); break;
    case 'tgen': {
      U.T.plan = U.T.focus === 'run' ? buildRunPlan() : genSession(U.T.min, U.T.focus, U.T.custom, U.T.level, Date.now() & 0xfffffff); keep(); render();
      const it = $('.item'); if (it) it.closest('section').scrollIntoView({ behavior: 'smooth', block: 'start' }); break;
    }
    case 'tstart': startPlayer(U.T.plan); break;
    case 'tmanual': {
      const m = Math.round(num(val('manmin'))); if (!(m > 0)) { toast('Entre les minutes'); break; }
      const w = (latestW() || { kg: 70 }).kg; saveSession(m, Math.round(5 * w * m / 60), {}, []); confetti(); toast('Séance de ' + m + ' min notée'); U.T.plan = null; U.tab = 'today'; render(); break;
    }
    /* lecteur */
    case 'ppause': { PL.paused = !PL.paused; const now = performance.now(); PL.last = now; b.textContent = PL.paused ? 'Reprendre' : 'Pause'; const sv = $('#pfig .fig'), f = sv && sv.__fig; if (f) { if (PL.paused) f.paused = now; else { f.t0 += now - f.paused; f.paused = 0; } } break; }
    case 'pmute': U.mute = !U.mute; try { localStorage.setItem('coach-mute', U.mute ? '1' : '0'); } catch (x) { } b.textContent = U.mute ? 'Son coupé' : 'Son activé'; break;
    case 'exinfo': openEx(+b.dataset.i); break;
    case 'exclose': closeEx(); break;
    case 'exswap': swapEx(+b.dataset.i); break;
    case 'water': { const ml = +v; addWater(ml); U.lastGlass = ml > 0 ? Math.floor(waterOf(today()) / 250) - 1 : null; keep(); render(); toast(ml > 0 ? nf(waterOf(today()) / 1000, 2) + ' L aujourd’hui' : 'Retiré'); U.lastGlass = null; break; }
    case 'pnext': goStep(PL.i + 1); break;
    case 'pprev': { let i = PL.i - 1; while (i > 0 && PL.steps[i].type !== 'work') i--; goStep(Math.max(0, i)); break; }
    case 'pquit':
      if (Date.now() - quitArm < 3500) { closePlayer(); PL = null; render(); }
      else { quitArm = Date.now(); b.textContent = 'Vraiment quitter ?'; }
      break;
    case 'psave': {
      const max = $('#pmax') && $('#pmax').checked, ex = [];
      $$('[data-rk]').forEach(i => { const n = Math.round(num(i.value)); if (n > 0) { const pr = prOf(i.dataset.rk); S.records.push({ id: uid(), d: today(), ex: i.dataset.rk, val: n, test: !!max }); if (max && n > pr && pr > 0) ex.push(i.dataset.rk); } });
      const z = {}; Object.entries(PL.zones).forEach(([k, m]) => { z[k] = +m.toFixed(1); });
      saveSessionFromPlayer(PL.zones);
      const prac = PL.plan.practice; closePlayer(); PL = null; U.T.plan = null; U.tab = prac ? 'train' : 'today'; render(); confetti(); toast(ex.length ? 'Nouveau record !' : 'Séance enregistrée, bravo !'); break;
    }
    /* repas */
    case 'mday': { const d = addDays(U.mealDate, +v); if (d <= today()) { U.mealDate = d; U.copy = ''; render(); } break; }
    case 'madd': {
      const text = val('mtext').trim(); if (!text) { toast('Écris ce que tu as mangé'); break; }
      const m = addMeal(text, val('mtype'), U.mealDate); keep(); render();
      toast(m.items.some(i => i.unk) ? 'Ajouté. Complète les calories des aliments non reconnus.' : '≈ ' + mealTot(m).kcal + ' kcal ajoutées'); break;
    }
    case 'mdel': S.meals = S.meals.filter(m => m.id !== b.dataset.id); delete S.reviews[U.mealDate]; save(); keep(); render(); break;
    case 'ask': askClaude(); break;
    case 'mdetail': aiDetail(b.dataset.id); break;
    case 'copyday': {
      U.copy = daySummary(U.mealDate) + '\nPeux-tu analyser ma journée (calories, protéines, ce qui manque) et me dire quoi manger ensuite ?';
      try { navigator.clipboard.writeText(U.copy).then(() => toast('Résumé copié'), () => toast('Sélectionne le texte pour le copier')); } catch (x) { toast('Sélectionne le texte pour le copier'); }
      keep(); render(); break;
    }
    /* progrès */
    case 'wstep': { const i = $('#wkg'), cur = num(i.value) || (latestW() || { kg: 70 }).kg, n = Math.round((cur + +v) * 10) / 10; i.value = nf(n); U.wkg = i.value; break; }
    case 'wadd': {
      const w = num(val('wkg')), d = val('wdate') || today();
      if (!(w >= 25 && w <= 300)) { toast('Poids entre 25 et 300 kg'); break; }
      S.weights = S.weights.filter(x => x.d !== d); S.weights.push({ d, kg: +w.toFixed(2) }); U.wkg = ''; U.wdate = today(); save(); keep(); render(); toast('Poids enregistré : ' + nf(w) + ' kg'); break;
    }
    case 'recex': U.recEx = v; keep(); render(); break;
    case 'recadd': {
      const n = Math.round(num(val('recv'))), test = $('#rectest').checked, rd = val('recdate') || today(); if (!(n > 0)) { toast('Entre ton résultat'); break; }
      const pr = prOf(U.recEx), old = rd < today(); S.records.push({ id: uid(), d: rd > today() ? today() : rd, ex: U.recEx, val: n, test }); save(); keep(); U.recDate = today(); render();
      if (test && !old && pr > 0 && n > pr) { confetti(); toast('Nouveau record : ' + n + ' !'); } else toast(old ? 'Ancien résultat noté au ' + fmtShort(rd) : 'Résultat noté'); break;
    }
    /* profil */
    case 'pday': { const d = +v, a = P().trainDays; P().trainDays = a.includes(d) ? a.filter(x => x !== d) : a.concat(d).sort(); save(); keep(); render(); break; }
    case 'prec': P().recordDay = +v; save(); keep(); render(); break;
    case 'peq': P().equip[v] = !P().equip[v]; save(); keep(); render(); break;
    case 'plow': P().lowImpact = !P().lowImpact; save(); keep(); render(); break;
    case 'export': U.exportTxt = JSON.stringify(S); try { navigator.clipboard.writeText(U.exportTxt).then(() => toast('Sauvegarde copiée'), () => { }); } catch (x) { } keep(); render(); break;
    case 'import': {
      try { const o = JSON.parse(val('impt')); if (!o || !o.profile) throw 0; S = mergeState(o); save(); checkBadges(true); U.boot = true; checkStreak(); U.boot = false; U.tab = 'today'; render(); toast('Sauvegarde importée'); }
      catch (x) { toast('Sauvegarde illisible'); } break;
    }
  }
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('div[role=button][data-act]')) { e.preventDefault(); e.target.click(); } if (e.key === 'Escape' && U.modal !== null && U.modal !== undefined) closeEx(); });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.act === 'tcustom') {
    U.T.custom[t.dataset.z] = +t.value; const tot = Object.values(U.T.custom).reduce((a, b) => a + b, 0) || 1;
    Object.keys(ZN).forEach(z => { const el = $('#pc-' + z); if (el) el.textContent = Math.round(U.T.custom[z] / tot * 100) + ' %'; });
  }
  if (t.id === 'wkg') U.wkg = t.value;
  if (t.id === 'a-min' || t.id === 'a-sec' || t.id === 'a-km' || t.id === 'a-elev') updateAPace();
  if (t.id === 'g-target' || t.id === 'g-days') updateGProb();
  if (t.id === 'wdate') U.wdate = t.value;
  if (t.id === 'recdate') U.recDate = t.value;
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'g-ex') { U.G.ex = t.value; U.G.target = ''; U.keepScroll = true; render(); return; }
  if (t.dataset && t.dataset.av) {
    const d = t.dataset.av, a = Object.assign({ m: 'free' }, P().avail[d]); a[t.dataset.f] = t.value; if (a.m === 'time' && !a.t) a.t = '17:30';
    P().avail[d] = a; P().availSet = true; save(); keep(); render(); return;
  }
  if (t.dataset && t.dataset.p) {
    const k = t.dataset.p; let v = t.value;
    if (k === 'height' || k === 'goalWeight') { const n = num(v); v = isFinite(n) ? String(n) : ''; t.value = v; }
    if (k === 'age') { const n = Math.round(num(v)); v = isFinite(n) ? String(n) : ''; t.value = v; }
    P()[k] = (k === 'level' || k === 'perWeek') ? +v : v; save(); keep(); render();
  }
  if (t.dataset && t.dataset.act === 'mgram') {
    const m = S.meals.find(x => x.id === t.dataset.m), i = m && m.items.find(x => x.id === t.dataset.i), g = Math.round(num(t.value));
    if (i && g >= 0) { i.grams = g; i.kcal = Math.round(g * i.k100 / 100); i.p = +(g * i.p100 / 100).toFixed(1); delete S.reviews[m.d]; save(); keep(); render(); } return;
  }
  if (t.dataset && t.dataset.act === 'munk') {
    const m = S.meals.find(x => x.id === t.dataset.m), i = m && m.items.find(x => x.id === t.dataset.i); if (i) { i.kcal = Math.max(0, Math.round(num(t.value) || 0)); delete S.reviews[m.d]; save(); keep(); render(); }
  }
});
window.addEventListener('hashchange', () => { const t = fromSlug(location.hash); if (t && t !== U.tab) { U.tab = t; render(); } });

/* ===== Démarrage ===== */
loadLocal();
checkBadges(true);
U.boot = true; checkStreak(); U.boot = false;
{ const t = fromSlug(location.hash); if (t) U.tab = t; }
render();
initRemote();
genNotifs(); updateBell();
setInterval(() => { genNotifs(); updateBell(); }, 60000);

</script>

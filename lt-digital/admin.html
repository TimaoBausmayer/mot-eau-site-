<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Mon site — L&amp;T Digital</title>
<link rel="icon" href="images/logo-small.jpg">
<style>
:root{--bg:#0a0912;--card:#14121f;--line:rgba(255,255,255,.12);--txt:#fff;--mut:#a9aec8;--lime:#c8ff3e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:17px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 20px;background:rgba(10,9,18,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.top h1{margin:0;font-size:22px;flex:1;min-width:180px}
.st{font-size:14px;color:var(--mut)}
.pub{padding:14px 26px;border:0;border-radius:999px;background:var(--lime);color:#0a0912;font-weight:800;font-size:18px;cursor:pointer}
.pub:disabled{opacity:.6;cursor:wait}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer;font-size:14px;padding:6px}
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;min-height:calc(100vh - 78px)}
.edit{padding:20px;overflow:auto}
.tabs{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.tab{flex:1;min-width:130px;padding:16px 10px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:18px;cursor:pointer}
.tab.on{border-color:var(--lime);background:rgba(200,255,62,.1)}
.preview{border-left:1px solid var(--line);background:#000;position:sticky;top:78px;height:calc(100vh - 78px)}
.preview iframe{width:100%;height:100%;border:0;background:#fff}
.help{margin:0 0 16px;padding:14px 16px;border-radius:14px;background:rgba(200,255,62,.08);border:1px solid rgba(200,255,62,.3);color:#e6f7b0}
h2{margin:26px 0 10px;font-size:20px}
.search{width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);margin-bottom:6px}
.row{border:1px solid var(--line);background:var(--card);border-radius:14px;margin:8px 0;padding:12px 14px}
.row.off{opacity:.55}
.r1{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.nm{flex:1;min-width:150px;font-weight:600}
.nm small{display:block;color:var(--mut);font-weight:400;font-size:13px}
.price{display:flex;align-items:center;gap:6px}
.price input{width:96px;padding:10px;border-radius:10px;border:2px solid var(--line);background:#0d0b16;text-align:right;font-size:18px;font-weight:700}
.price input:focus,.f input:focus,.f textarea:focus,.search:focus{outline:2px solid var(--lime);outline-offset:1px}
.sw{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-size:15px}
.sw input{display:none}
.sw i{width:46px;height:26px;border-radius:99px;background:#3a3750;position:relative;transition:.2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--lime)}
.sw input:checked+i::after{left:23px;background:#0a0912}
.more{background:none;border:0;color:var(--mut);cursor:pointer;font-size:14px;text-decoration:underline}
.more-box{margin-top:10px;display:none}
.row.open .more-box{display:block}
.f{display:block;margin:14px 0}
.f span{display:block;margin-bottom:6px;font-weight:600}
.f small{display:block;color:var(--mut);margin-top:4px;font-size:13px}
.f input,.f textarea{width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:#0d0b16}
.empty{color:var(--mut);padding:20px;text-align:center}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);max-width:92vw;padding:16px 22px;border-radius:16px;background:#fff;color:#0a0912;font-weight:600;box-shadow:0 10px 40px rgba(0,0,0,.5);display:none;z-index:9}
.mob{display:none}
@media(max-width:900px){.main{grid-template-columns:1fr}.preview{display:none;position:fixed;inset:0;z-index:8;height:auto;top:0}.preview.show{display:block}.mob{display:inline-block}.x{position:absolute;top:8px;right:8px;z-index:2;padding:10px 16px;border-radius:99px;border:0;background:#fff;color:#000;font-weight:700}}
</style>
</head>
<body>
<div class="top">
  <h1>🛠 Mon site</h1>
  <span class="st" id="st"></span>
  <button class="link mob" id="b-prev">👁 Voir le site</button>
  <button class="pub" id="b-pub">✅ Publier mon site</button>
</div>
<div class="main">
  <section class="edit">
    <div class="tabs" id="tabs"></div>
    <div id="pane"></div>
    <p style="margin-top:40px;text-align:center">
      <button class="link" id="b-reset">↺ Annuler mes changements</button> ·
      <a class="link" href="/admin?avance=1" style="color:var(--mut)">Réglages avancés</a> ·
      <a class="link" href="/admin?logout=1" style="color:var(--mut)">Me déconnecter</a>
    </p>
  </section>
  <aside class="preview" id="preview"><button class="x mob" id="b-close">✕ Fermer</button><iframe id="frame" src="index.html?preview" title="Aperçu du site"></iframe></aside>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="config.js"></script>
<script>
(function(){
const KEY = "ltd_draft";
const ORIGINAL = JSON.parse(JSON.stringify(window.SITE_CONFIG));
let cfg;
try { const d = localStorage.getItem(KEY); cfg = d ? JSON.parse(d) : JSON.parse(JSON.stringify(ORIGINAL)); } catch(e){ cfg = JSON.parse(JSON.stringify(ORIGINAL)); }
const $ = id => document.getElementById(id);
const h = (tag, attrs, ...kids) => { const e = document.createElement(tag);
  for (const k in (attrs||{})) { if (k==="on") for (const ev in attrs.on) e.addEventListener(ev, attrs.on[ev]); else if (k==="class") e.className = attrs[k]; else e.setAttribute(k, attrs[k]); }
  kids.flat().forEach(c => c!=null && e.append(c.nodeType ? c : document.createTextNode(c))); return e; };
const sym = (cfg.currency && cfg.currency.symbol) || "€";
let dirty = false, t1, t2;
addEventListener("beforeunload", e=>{ if(dirty){ e.preventDefault(); e.returnValue=""; } });
function toast(msg, ms){ const t=$("toast"); t.textContent=msg; t.style.display="block"; clearTimeout(toast.k); toast.k=setTimeout(()=>t.style.display="none", ms||5000); }
function changed(){
  dirty = true; $("st").textContent = "Changements non publiés";
  clearTimeout(t1); t1 = setTimeout(()=>{ try{ localStorage.setItem(KEY, JSON.stringify(cfg)); }catch(e){} }, 200);
  clearTimeout(t2); t2 = setTimeout(()=>{ try{ $("frame").contentWindow.location.reload(); }catch(e){ $("frame").src="index.html?preview&t="+Date.now(); } }, 700);
}

/* ---- un champ de texte simple ---- */
function field(label, obj, key, o){ o=o||{};
  const inp = o.area ? h("textarea",{rows:o.rows||3}) : h("input",{type:"text"});
  inp.value = obj[key] ?? ""; if (o.ph) inp.placeholder = o.ph;
  inp.addEventListener("input", ()=>{ obj[key] = inp.value; changed(); });
  return h("label",{class:"f"}, h("span",{},label), inp, o.hint?h("small",{},o.hint):null);
}

/* ---- une ligne « produit » : nom, prix, afficher / cacher ---- */
function row(item, o){ o=o||{};
  const box = h("div",{class:"row"+(item.hidden?" off":"")});
  const price = h("input",{type:"number",min:"0",step:"1",inputmode:"decimal",placeholder:"Sur devis","aria-label":"Prix de "+item.name});
  price.value = item.price==null ? "" : item.price;
  price.addEventListener("input", ()=>{ item.price = price.value==="" ? null : Math.max(0, Number(price.value)); changed(); });
  const cb = h("input",{type:"checkbox"}); cb.checked = !item.hidden;
  cb.addEventListener("change", ()=>{ item.hidden = !cb.checked; box.classList.toggle("off", item.hidden); sw.lastChild.textContent = cb.checked?"Visible":"Caché"; changed(); });
  const sw = h("label",{class:"sw"}, cb, h("i"), h("span",{}, item.hidden?"Caché":"Visible"));
  const nameIn = h("input",{type:"text"}); nameIn.value = item.name||"";
  nameIn.addEventListener("input", ()=>{ item.name = nameIn.value; changed(); });
  const more = h("button",{type:"button",class:"more"},"✏️ Changer le nom ou le texte");
  const boxMore = h("div",{class:"more-box"},
    h("label",{class:"f"}, h("span",{},"Nom"), nameIn),
    item.desc!=null || o.desc!==false ? (()=>{ const t=h("textarea",{rows:"3"}); t.value=item.desc||""; t.addEventListener("input",()=>{ item.desc=t.value; changed(); }); return h("label",{class:"f"}, h("span",{},"Petit texte"), t); })() : null);
  more.onclick = ()=>box.classList.toggle("open");
  box.append(h("div",{class:"r1"},
    h("div",{class:"nm"}, item.name, item.unit||item.group ? h("small",{}, [item.group, item.unit].filter(Boolean).join(" · ")) : null),
    h("div",{class:"price"}, price, h("span",{},sym+(item.unit||""))), sw), h("div",{},more), boxMore);
  box._name = ((item.name||"")+" "+(item.group||"")).toLowerCase();
  return box;
}

/* ---- onglets ---- */
const TABS = [["prix","💶 Les prix"],["textes","✏️ Les textes"],["contact","📞 Mes contacts"]];
let current = "prix";
function show(id){
  current = id;
  $("tabs").replaceChildren(...TABS.map(([k,l])=>h("button",{type:"button",class:"tab"+(k===id?" on":""),on:{click:()=>show(k)}},l)));
  const p = $("pane"); p.replaceChildren();
  if (id==="prix") prix(p); else if (id==="textes") textes(p); else contact(p);
}
function prix(p){
  p.append(h("p",{class:"help"},"Change un prix : il se met à jour à droite. Pour cacher une offre, mets l'interrupteur sur « Caché ». Quand tu as fini, clique sur le gros bouton vert « Publier mon site » en haut."));
  const s = h("input",{class:"search",type:"search",placeholder:"🔎 Cherche (ex : logo, vidéo, réservation…)"});
  p.append(s);
  const groups = [["Mes sites", cfg.plans||[], {}],["Les options des sites", cfg.addons||[], {}],["Photos, logos, vidéos et réseaux", (cfg.services&&cfg.services.items)||[], {}]];
  const blocks = groups.map(([title, list, o])=>{
    const rows = list.map(it=>row(it,o)); const box = h("div",{}, h("h2",{},title), ...rows); p.append(box); return {box, rows, h2: box.firstChild};
  });
  s.addEventListener("input", ()=>{ const q = s.value.trim().toLowerCase(); blocks.forEach(b=>{ let n=0; b.rows.forEach(r=>{ const ok=!q||r._name.includes(q); r.style.display=ok?"":"none"; if(ok)n++; }); b.h2.style.display = n?"":"none"; }); });
}
function textes(p){
  cfg.hero = cfg.hero || {};
  p.append(h("p",{class:"help"},"Ici, tu changes les phrases les plus importantes de ton site."),
    field("Bandeau tout en haut du site", cfg, "announce", {hint:"Par exemple une promo. Laisse vide pour le cacher."}),
    field("Gros titre de l'accueil", cfg.hero, "title"),
    field("Fin du titre (en couleur)", cfg.hero, "titleAccent"),
    field("Phrase sous le titre", cfg.hero, "text", {area:true, hint:"Écris {delivery} pour afficher le délai de livraison."}),
    field("Bouton 1", cfg.hero, "cta1"), field("Bouton 2", cfg.hero, "cta2"));
}
function contact(p){
  cfg.contact = cfg.contact || {};
  p.append(h("p",{class:"help"},"Comment tes clients peuvent te joindre."),
    field("Ton e-mail", cfg.contact, "email", {hint:"Laisse vide pour cacher le bouton e-mail."}),
    field("Lien de ton Instagram", cfg.contact, "instagram", {ph:"https://www.instagram.com/…"}),
    field("Ton nom Instagram", cfg.contact, "instagramHandle", {ph:"@toncompte"}));
}

/* ---- publier ---- */
function build(){ return "/* Fichier généré par la page d'administration — tu peux aussi le modifier à la main. */\nwindow.SITE_CONFIG = " + JSON.stringify(cfg, null, 2) + ";\n"; }
function download(){ const a = h("a",{href:URL.createObjectURL(new Blob([build()],{type:"text/javascript"})),download:"config.js"}); document.body.append(a); a.click(); a.remove(); }
$("b-pub").onclick = async () => {
  const b = $("b-pub"); b.disabled = true; b.textContent = "Publication…";
  try {
    const r = await fetch("/admin?publish=1", {method:"POST", headers:{"Content-Type":"application/json"}, credentials:"same-origin", body: JSON.stringify({config: cfg})});
    let j = {}; try { j = await r.json(); } catch(e){}
    if (r.ok && j.ok) { dirty = false; try{localStorage.removeItem(KEY);}catch(e){} $("st").textContent = "✔ Publié"; toast("✅ C'est publié ! Ton site se met à jour dans environ 1 minute.", 9000); }
    else if (j.error === "not-configured") { download(); dirty = false; toast("Le bouton automatique n'est pas encore branché. J'ai téléchargé le fichier « config.js » : envoie-le moi (Claude) et je le publie pour toi.", 14000); }
    else if (r.status === 401) { toast("Tu as été déconnecté. Recharge la page et reconnecte-toi.", 9000); }
    else { toast("Ça n'a pas marché : " + (j.message || ("erreur " + r.status)) + " Ton travail est gardé ici, réessaie.", 12000); }
  } catch(e) { toast("Pas de connexion internet. Réessaie dans un instant.", 8000); }
  b.disabled = false; b.textContent = "✅ Publier mon site";
};
$("b-reset").onclick = () => { if(confirm("Annuler tous tes changements non publiés ?")){ cfg = JSON.parse(JSON.stringify(ORIGINAL)); try{localStorage.removeItem(KEY);}catch(e){} dirty=false; $("st").textContent=""; changed(); dirty=false; $("st").textContent=""; show(current); } };
$("b-prev").onclick = () => $("preview").classList.add("show");
$("b-close").onclick = () => $("preview").classList.remove("show");
show("prix");
})();
</script>
</body>
</html>

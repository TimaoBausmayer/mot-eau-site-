<section class="sc s11" style="--a:20s;--b:22s">
  <div class="s11-bg"></div>
  <div class="s11-cam">
    <div class="s11-shake" id="s11-shake">
      <div class="s11-move">
        <div class="s11-rays"><i class="s11-raysSpin"></i></div>
        <div class="s11-glow"><i class="s11-glowB"></i><i class="s11-glowP" id="s11-glowP"></i></div>
        <div class="s11-stage">
          <div class="s11-sway">
          <div class="s11-flip">
            <img class="s11-logo" src="../images/logo.jpg" alt="L&amp;T Digital" width="600" height="600">
            <img class="s11-ring" src="../images/logo.jpg" alt="" width="600" height="600">
            <svg class="s11-flash" viewBox="0 0 600 600" width="600" height="600" aria-hidden="true"><circle cx="300" cy="300" r="235"/></svg>
            <i class="s11-sheen"></i>
            <svg class="s11-orbit" id="s11-orbit" viewBox="0 0 900 900" width="900" height="900" aria-hidden="true">
              <defs>
                <linearGradient id="s11-og" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
                  <stop offset="0" stop-color="#3d6bff"/><stop offset=".45" stop-color="#8fa2ff"/><stop offset="1" stop-color="#c8ff3e"/>
                </linearGradient>
                <filter id="s11-cblur" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="9"/></filter>
              </defs>
              <path class="s11-oGlow" d="M4 450A446 446 0 0 0 896 450A446 446 0 0 0 4 450" pathLength="1000"/>
              <path class="s11-oLine" d="M4 450A446 446 0 0 0 896 450A446 446 0 0 0 4 450" pathLength="1000"/>
              <path class="s11-cTail" id="s11-cTail" d="M4 450A446 446 0 0 0 896 450A446 446 0 0 0 4 450" pathLength="1000"/>
              <path class="s11-cMid" id="s11-cMid" d="M4 450A446 446 0 0 0 896 450A446 446 0 0 0 4 450" pathLength="1000"/>
              <path class="s11-cGlow" id="s11-cGlow" d="M4 450A446 446 0 0 0 896 450A446 446 0 0 0 4 450" pathLength="1000" filter="url(#s11-cblur)"/>
              <path class="s11-cHead" id="s11-cHead" d="M4 450A446 446 0 0 0 896 450A446 446 0 0 0 4 450" pathLength="1000"/>
            </svg>
          </div>
          </div>
        </div>
      </div>
      <canvas class="s11-p" id="s11-p" width="1080" height="1920"></canvas>
      <i class="s11-streak"></i>
    </div>
  </div>
  <div class="s11-handle" id="s11-handle">@l.t_digital</div>
  <i class="s11-cur" id="s11-cur"></i>
  <i class="s11-ripple"></i>
  <div class="s11-dotY"><i class="s11-dot"></i></div>
</section>

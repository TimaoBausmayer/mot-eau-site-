<!DOCTYPE html>

<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex"><meta name="theme-color" content="#0a0912">
<title>Page introuvable — L&amp;T Digital</title><link rel="icon" href="/images/logo-small.jpg"><link rel="stylesheet" href="/fonts/fonts.css"><link rel="stylesheet" href="/style.css">
<style>

.nf h1{font-size:clamp(1.6rem,5vw,2.2rem);margin:14px 0 10px}
.nf p{color:#c9cbd9;margin:0 auto 26px;max-width:30em}
.nf-btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
</style></head>

</div></main></body>
</html>
